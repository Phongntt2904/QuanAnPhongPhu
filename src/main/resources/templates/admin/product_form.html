<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm món ăn mới - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
<div class="container bg-white p-5 shadow rounded" style="max-width: 600px;">
    <h2 class="mb-4">Thêm/Sửa Món Ăn</h2>
    <form th:action="@{/admin/product/save}" th:object="${product}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Tên món ăn</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Giá (VNĐ)</label>
            <input type="number" th:field="*{price}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Link ảnh (URL)</label>
            <input type="text" th:field="*{imageUrl}" class="form-control">
        </div>

        <div class="mb-4">
            <label class="form-label">Danh mục</label>
            <select th:field="*{category}" class="form-select">
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/admin}" class="btn btn-secondary">Hủy</a>
            <button type="submit" class="btn btn-success">Lưu món ăn</button>
        </div>
    </form>
</div>
</body>
</html>
