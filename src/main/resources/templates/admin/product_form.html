<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head('Thêm/Sửa món ăn - Admin')}"></head>
<style>
    body { background-color: var(--bg-light); }
    .form-container { max-width: 600px; margin: 50px auto; }
</style>
<body>

<nav th:replace="~{fragments :: header}"></nav>

<div class="content-wrapper">
    <div class="container form-container bg-white p-5 shadow rounded-4">
        <h2 class="mb-4 fw-bold">Thêm/Sửa Món Ăn</h2>
        <form th:action="@{/admin/product/save}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label fw-bold">Tên món ăn</label>
                <input type="text" th:field="*{name}" class="form-control rounded-3 py-2" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Mô tả</label>
                <textarea th:field="*{description}" class="form-control rounded-3 py-2" rows="2"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Giá (VNĐ)</label>
                <input type="number" th:field="*{price}" class="form-control rounded-3 py-2" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Link ảnh (URL)</label>
                <input type="text" th:field="*{imageUrl}" class="form-control rounded-3 py-2">
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Danh mục</label>
                <select th:field="*{category.id}" class="form-select rounded-3 py-2">
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
            </div>

            <div class="d-flex justify-content-between">
                <a th:href="@{/admin}" class="btn btn-outline-secondary rounded-pill px-4 hover-scale">Hủy</a>
                <button type="submit" class="btn btn-danger rounded-pill px-4 hover-scale">Lưu món ăn</button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
