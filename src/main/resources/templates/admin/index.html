<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark shadow mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">ADMIN DASHBOARD</a>
        <a th:href="@{/}" class="btn btn-outline-light btn-sm">Xem Trang Chủ</a>
    </div>
</nav>

<div class="container bg-white p-4 shadow-sm rounded">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Danh sách món ăn</h3>
        <a th:href="@{/admin/product/add}" class="btn btn-primary">+ Thêm món mới</a>
    </div>

    <table class="table table-hover">
        <thead class="table-dark">
            <tr>
                <th>Ảnh</th>
                <th>Tên món</th>
                <th>Giá</th>
                <th>Danh mục</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${products}">
                <td><img th:src="${p.imageUrl}" style="width: 50px; height: 50px; object-fit: cover;"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                <td th:text="${p.category != null ? p.category.name : 'N/A'}"></td>
                <td>
                    <a th:href="@{/admin/product/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa món này?')">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
