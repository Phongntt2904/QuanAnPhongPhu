<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tham gia cộng đồng Foodie - Food Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%); min-height: 100vh; display: flex; align-items: center; }
        .register-container { max-width: 550px; background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .form-control { border-radius: 10px; padding: 12px; }
        .btn-register { background: #ff4757; color: white; font-weight: bold; border-radius: 10px; padding: 12px; border: none; }
        .btn-register:hover { background: #e84118; color: white; }
    </style>
</head>
<body>
<div class="container register-container p-5 my-5">
    <div class="text-center mb-4">
        <h2 class="fw-bold">Đăng Ký Thành Viên</h2>
        <p class="text-muted">Gia nhập để nhận ngàn ưu đãi đồ ăn</p>
    </div>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Họ và tên</label>
                <input type="text" th:field="*{fullName}" class="form-control" placeholder="VD: Nguyễn Văn A" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Số điện thoại</label>
                <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="09xxx..." required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Tên đăng nhập</label>
                <input type="text" th:field="*{username}" class="form-control" placeholder="username123" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Mật khẩu</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="********" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">Địa chỉ giao hàng</label>
            <textarea th:field="*{address}" class="form-control" rows="2" placeholder="Số nhà, tên đường, quận/huyện..." required></textarea>
        </div>

        <button type="submit" class="btn btn-register w-100 mb-3">ĐĂNG KÝ NGAY</button>
    </form>

    <div class="text-center">
        Đã có tài khoản? <a th:href="@{/login}" class="text-danger fw-bold text-decoration-none">Đăng nhập</a>
    </div>
</div>
</body>
</html>
