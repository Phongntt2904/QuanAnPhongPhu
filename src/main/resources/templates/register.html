<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head('Đăng ký - FoodHub')}"></head>
<style>
    body { background-color: var(--bg-light); }
    .register-container { max-width: 550px; margin-top: 50px; margin-bottom: 50px; }
    .btn-register { background: var(--primary-color); color: white; font-weight: bold; border-radius: 10px; padding: 12px; border: none; }
    .btn-register:hover { background: #e84118; color: white; }
</style>
<body>

<div th:replace="~{fragments :: header}"></div>

<div class="content-wrapper d-flex align-items-center justify-content-center">
    <div class="container register-container bg-white p-5 shadow rounded-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Đăng Ký Thành Viên</h2>
            <p class="text-muted">Gia nhập để nhận ngàn ưu đãi đồ ăn</p>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Họ và tên</label>
                    <input type="text" th:field="*{fullName}" class="form-control rounded-3 py-2" placeholder="VD: Nguyễn Văn A" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" th:field="*{email}" class="form-control rounded-3 py-2" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Số điện thoại</label>
                    <input type="text" th:field="*{phoneNumber}" class="form-control rounded-3 py-2" placeholder="09xxx..." required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Tên đăng nhập</label>
                    <input type="text" th:field="*{username}" class="form-control rounded-3 py-2" placeholder="username123" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Mật khẩu</label>
                <input type="password" th:field="*{password}" class="form-control rounded-3 py-2" placeholder="********" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Địa chỉ giao hàng</label>
                <textarea th:field="*{address}" class="form-control rounded-3 py-2" rows="2" placeholder="Số nhà, tên đường, quận/huyện..." required></textarea>
            </div>

            <button type="submit" class="btn btn-register w-100 mb-3 hover-scale">ĐĂNG KÝ NGAY</button>
        </form>

        <div class="mt-4 text-center">
            Đã có tài khoản? <a th:href="@{/login}" class="text-danger fw-bold text-decoration-none">Đăng nhập</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
