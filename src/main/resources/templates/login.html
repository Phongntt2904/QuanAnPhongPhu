<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html_head('Đăng nhập - FoodHub')}"></head>
<style>
    body { background-color: var(--bg-light); }
    .login-container { max-width: 450px; margin-top: 80px; }
    .btn-login { background: var(--primary-color); color: white; font-weight: bold; border-radius: 10px; padding: 12px; border: none; }
    .btn-login:hover { background: #e84118; color: white; }
</style>
<body>

<div th:replace="~{fragments :: header}"></div>

<div class="content-wrapper d-flex align-items-center justify-content-center">
    <div class="container login-container bg-white p-5 shadow rounded-4">
        <h2 class="text-center fw-bold mb-4">Đăng nhập</h2>
        <div th:if="${param.error}" class="alert alert-danger text-center">
            Tên đăng nhập hoặc mật khẩu không đúng.
        </div>
        <div th:if="${param.logout}" class="alert alert-success text-center">
            Bạn đã đăng xuất thành công.
        </div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control rounded-3 py-2" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Mật khẩu</label>
                <input type="password" name="password" class="form-control rounded-3 py-2" required>
            </div>
            <button type="submit" class="btn btn-login w-100 hover-scale">Đăng nhập</button>
        </form>
        <div class="mt-4 text-center">
            Chưa có tài khoản? <a th:href="@{/register}" class="text-danger fw-bold text-decoration-none">Đăng ký ngay</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
